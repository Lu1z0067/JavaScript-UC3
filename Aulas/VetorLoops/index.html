    <title>Loops e Vetores</title>

<body>
    <div class="container">
        <h1 id="titulo">Loops For e While</h1>
        <h2 id="contador">0</h2>

        <!-- ambos tem a classe "btn" e cada um tem sua própria -->

        <button class="btn contar" onclick="iniciarContadorFor()">Iniciar Contador For</button>

        <button class="btn contar" onclick="contadorVetor()">Mostrar Vetor</button>

        <button class="btn trocar" onclick="trocarClasse()">Trocar Classe</button>

    </div>
